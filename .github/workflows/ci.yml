name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Python avec cache pip
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dependances
        run: pip install -e ".[dev]"

      - name: Verifier le code avec Ruff
        run: ruff check app tests

      - name: Verifier le formatage
        run: ruff format --check app tests

      - name: Executer pre-commit
        run: pre-commit run --all-files

      - name: Lancer les tests avec couverture
        run: pytest --cov=app --cov-report=xml --cov-report=html

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python }}
          path: htmlcov/
          retention-days: 7
